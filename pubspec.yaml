name: thehatch_admin
description: The Hatch store admin dashboard (Flutter Web).
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  get_storage: ^2.1.1
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  google_fonts: ^8.2.1
  intl: ^0.20.3
  firebase_storage: ^14.0.1
  file_picker: ^13.3.3
  firebase_ai: ^5.1.0
  crop_your_image: ^2.0.1
  excel: ^4.0.6
  csv: ^8.0.0
  archive: ^3.6.1
  http: ^1.6.0
  fl_chart: ^1.3.1
  web: ^1.1.1
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
